<!DOCTYPE html>
<html>
<head>
<title>Boy Shooting Game</title>
<style>
body{background:#111;color:#fff;text-align:center;font-family:Arial}
canvas{background:#222;display:block;margin:auto;border:3px solid #fff}
button{padding:10px;font-size:18px;margin:5px}
</style>
</head>
<body>

<h1>🎮 Boy Shooting Game</h1>
<button onclick="startGame()">Start</button>
<button onclick="restartGame()">Restart</button>

<canvas id="game" width="800" height="400"></canvas>

<h2 id="score">Score: 0</h2>
<h2 id="health">Health: 3</h2>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const c = game.getContext("2d");

let gameStart=0, score=0, health=3;
let player={x:50,y:180,speed:9};
let bullets=[], enemies=[], explosions=[], keys={}, lastShot=0;

onkeydown=e=>keys[e.key]=1;
onkeyup=e=>keys[e.key]=0;

const updateUI=()=>{
  scoreEl.innerText="Score: "+score;
  healthEl.innerText="Health: "+health;
};

const scoreEl=score, healthEl=health, bgMusic=document.getElementById("bgMusic");

function startGame(){ gameStart=1; spawnEnemy(); bgMusic.play(); }

function restartGame(){
  score=0; health=3;
  bullets=enemies=explosions=[];
  player.x=50; player.y=180;
  updateUI(); gameStart=1;
}

function spawnEnemy(){
  setInterval(()=>gameStart && enemies.push({
    x:750, y:Math.random()*350, speed:2
  }),2000);
}

const shoot=()=>{
  let now=Date.now();
  if(now-lastShot>200){
    bullets.push({x:player.x+40,y:player.y+15,speed:8});
    lastShot=now;
  }
};

const move=()=>{
  if(keys.ArrowUp && player.y>0) player.y-=player.speed;
  if(keys.ArrowDown && player.y<360) player.y+=player.speed;
};

const hit=(a,b)=>a.x<b.x+30&&a.x+12>b.x&&a.y<b.y+30&&a.y+12>b.y;

function update(){
  if(!gameStart) return;
  move(); if(keys[" "]) shoot();

  bullets.forEach(b=>b.x+=b.speed);
  enemies.forEach(e=>e.x-=e.speed);

  bullets.forEach((b,bi)=>{
    enemies.forEach((e,ei)=>{
      if(hit(b,e)){
        score++; explosions.push({x:e.x+15,y:e.y+15,size:10,time:20});
        bullets.splice(bi,1); enemies.splice(ei,1); updateUI();
      }
    });
  });

  enemies.forEach((e,ei)=>{
    if(hit(e,player)){
      health-=3; enemies.splice(ei,1); updateUI();
    }
  });

  if(health<=0) gameStart=0;
}

function draw(){
  c.clearRect(0,0,800,400);

  if(!gameStart){
    c.fillStyle="#fff"; c.font="40px Arial";
    return c.fillText("GAME OVER",300,200);
  }

  c.font="40px Arial";
  c.fillText("🧍",player.x,player.y);

  bullets.forEach(b=>{c.fillStyle="yellow";c.fillRect(b.x,b.y,12,4)});
  enemies.forEach(e=>c.fillText("👾",e.x,e.y));

  explosions.forEach((ex,i)=>{
    c.fillStyle="orange";
    c.beginPath(); c.arc(ex.x,ex.y,ex.size,0,6.28); c.fill();
    ex.size+=2; if(--ex.time<=0) explosions.splice(i,1);
  });
}

(function loop(){ update(); draw(); requestAnimationFrame(loop); })();
</script>

</body>
</html>
